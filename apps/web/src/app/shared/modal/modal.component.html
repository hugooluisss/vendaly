<div class="overlay" (click)="onOverlayClick($event)">
  <section class="modal card" role="dialog" aria-modal="true" [attr.aria-label]="title">
    <header><h2>{{ title }}</h2><button type="button" class="close btn btn-secondary" aria-label="Cerrar" (click)="close.emit()">×</button></header>
    <ng-content></ng-content>
  </section>
</div>
