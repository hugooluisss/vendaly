<section class="card"><h1>{{ created ? 'Negocio creado' : 'Crea tu negocio' }}</h1>@if (!created) {<p>Solo necesitamos el nombre. El slug público lo genera el servidor.</p><form (ngSubmit)="create()"><label>Nombre<input [formControl]="name" autofocus></label><button class="button" [disabled]="name.invalid">Continuar</button></form>} @else {<p>Ya puedes completar tu perfil y horarios.</p><button class="button" (click)="goSettings()">Configurar negocio</button>}</section>
