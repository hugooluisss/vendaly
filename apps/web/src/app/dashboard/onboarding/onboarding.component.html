<section class="card"><h1>{{ created ? 'Negocio creado' : 'Crea tu negocio' }}</h1>@if (!created) {<p>Solo necesitamos el nombre. El slug público lo genera el servidor.</p><form [formGroup]="form" (ngSubmit)="create()"><label>Nombre<input class="field-input" formControlName="name" autofocus></label><button class="btn btn-primary" [disabled]="form.invalid">Continuar</button></form>} @else {<p>Ya puedes completar tu perfil y horarios.</p><button class="btn btn-primary" (click)="goSettings()">Configurar negocio</button>}</section>
