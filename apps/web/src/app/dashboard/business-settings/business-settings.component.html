<section class="card"><p class="eyebrow">CONFIGURACIÓN</p><h1>Perfil del negocio</h1>@if (businessId) {<button class="button secondary hours-button" (click)="hoursModal = true">Editar horarios</button><form [formGroup]="profile" (ngSubmit)="saveProfile()"><label>Nombre<input formControlName="name"></label><label>WhatsApp<input formControlName="whatsapp_number" placeholder="5215512345678"></label><label>Descripción<textarea formControlName="description"></textarea></label><label>Categoría<select formControlName="category"><option [ngValue]="null">Selecciona una categoría</option>@for (category of categories; track category.value) {<option [value]="category.value">{{ category.label }}</option>}</select></label><label>Ubicación<input formControlName="location" placeholder="Ciudad o zona"></label><app-image-upload label="Logo" (cropped)="onLogoSelected($event)"></app-image-upload><app-image-upload label="Portada" [aspectRatio]="16 / 9" (cropped)="onCoverSelected($event)"></app-image-upload>@if (coverImageUrl) {<img class="cover-preview" [src]="coverImageUrl" alt="Portada actual">}<label>Ubicación en el mapa</label><app-map mode="pin" [center]="mapCenter" [initialPosition]="position" (positionChanged)="onPositionChanged($event)"></app-map><button class="button" [disabled]="profile.invalid">Guardar perfil</button></form>} @else {<p>No hay negocio cargado. <a href="/dashboard/onboarding">Créalo primero.</a></p>}</section>@if (hoursModal) {<app-modal title="Horarios" (close)="hoursModal = false"><form (ngSubmit)="saveHours()"><div class="hours">@for (hour of hours; track hour.day_of_week) {<div class="day"><strong>{{ dayNames[hour.day_of_week] }}</strong><label><input type="checkbox" [checked]="hour.is_closed" (change)="hour.is_closed = !hour.is_closed"> Cerrado</label><input type="time" [(ngModel)]="hour.opens_at" [ngModelOptions]="{standalone: true}" [disabled]="hour.is_closed"><input type="time" [(ngModel)]="hour.closes_at" [ngModelOptions]="{standalone: true}" [disabled]="hour.is_closed"></div>}</div><button class="button">Guardar horarios</button></form></app-modal>}
