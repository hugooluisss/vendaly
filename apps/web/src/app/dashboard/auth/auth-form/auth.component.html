<main class="card">
  <h1>{{ registerMode ? 'Crear cuenta' : 'Iniciar sesión' }}</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>Email <input class="field-input" type="email" formControlName="email" autocomplete="email"></label>
    <label>Contraseña <input class="field-input" type="password" formControlName="password" autocomplete="current-password"></label>
    <button class="btn btn-primary" type="submit" [disabled]="form.invalid || submitting">{{ registerMode ? 'Registrarme' : 'Entrar' }}</button>
  </form>
  <a class="text-vendaly-orange" [routerLink]="registerMode ? '../login' : '../register'">
    {{ registerMode ? 'Ya tengo una cuenta' : 'Crear una cuenta' }}
  </a>
</main>
